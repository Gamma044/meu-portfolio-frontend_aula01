<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfólio - Gabriel Felipe Gama</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Caixa principal que junta todo o conteúdo do portfólio -->
    <main class="cartao">
        
        <header class="cabecalho">
            <!-- Banner do topo -->
            <img src="imagens/banner.jpg" alt="Imagem de fundo tecnológica com códigos" class="img-banner">
            
            <!-- Container exclusivo da foto de perfil -->
            <div class="perfil-container">
                <img src="imagens/perfil.jpg" alt="Foto de perfil de Gabriel Felipe Gama" class="img-perfil">
            </div>
        </header>

        <!-- Informações do Perfil -->
        <section class="conteudo">
            <h1>Gabriel Felipe Gama</h1>
            <p class="biografia">Tenho 21 anos de idade, trabalho em uma empresa de tecnologia voltada a rastreamento de veículos e faço um curso técnico em Desenvolvimento de Sistemas.</p>
            
            <h2>Ferramentas Para Aprender</h2>
            <ul class="lista-ferramentas">
                <li>HTML</li>
                <li>CSS</li>
                <li>Python</li>
            </ul>
        </section>

    </main>

</body>
</html>
